<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Mushoku Tensei Reader</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --paper: #f5efe4;
      --paper-2: #eee5d6;
      --ink: #2c2722;
      --ink-soft: #5f574c;
      --accent: #8e3b46;
      --line: rgba(76, 58, 39, 0.16);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #151412;
        --paper-2: #1d1b18;
        --ink: #e9e2d6;
        --ink-soft: #b9ae9e;
        --accent: #d38c96;
        --line: rgba(234, 223, 202, 0.14);
      }
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--serif);
      text-align: center;
    }
    main {
      max-width: 32rem;
      padding: 2.5rem;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    p.eyebrow {
      margin: 0;
      color: var(--ink-soft);
      font-family: var(--ui);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0.6rem 0 0.8rem;
      font-size: 2rem;
      font-weight: 600;
    }
    p {
      margin: 0 0 1.6rem;
      color: var(--ink-soft);
      line-height: 1.7;
    }
    a {
      display: inline-block;
      padding: 0.7rem 1.3rem;
      color: var(--paper);
      background: var(--ink);
      border-radius: 999px;
      font-family: var(--ui);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Mushoku Tensei Reader</p>
    <h1>That page is not part of the library</h1>
    <p>
      The address you followed does not match a volume, a chapter, or a scene.
      Head back to the front page and pick a volume to read.
    </p>
    <a href="/">Back to the volumes</a>
  </main>
</body>
</html>
