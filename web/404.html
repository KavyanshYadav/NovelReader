<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found, Mushoku Tensei Reader</title>
  <meta name="description" content="The address does not match a volume, a chapter, or a scene in the Mushoku Tensei Reader. Return to the volumes to pick up reading.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafaf9">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try {
      var savedTheme = localStorage.getItem("mt15:theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>
  <link rel="stylesheet" href="tokens.css">
  <style>
    .error-page {
      display: flex;
      align-items: flex-start;
      min-height: 100dvh;
      padding: var(--space-2xl) var(--gutter);
      background: var(--paper);
    }

    .error-notice {
      width: 100%;
      max-width: 640px;
      margin: 12dvh auto 0;
      padding-top: var(--space-lg);
      border-top: 1px solid var(--rule-strong);
    }

    .error-code {
      color: var(--muted);
      font-family: var(--font-ui);
      font-size: var(--text-figure);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 0.9;
    }

    .error-notice h1 {
      max-width: 14ch;
      margin-top: var(--space-xs);
      font-size: var(--text-3xl);
      line-height: 1.05;
    }

    .error-note {
      max-width: 46ch;
      margin: var(--space-md) 0 var(--space-xl);
      color: var(--ink-2);
      font-size: var(--text-md);
      line-height: 1.65;
    }

    .error-notice .button {
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .error-page {
        padding-block: var(--space-xl);
      }

      .error-code {
        font-size: var(--text-display);
      }

      .error-notice h1 {
        font-size: var(--text-2xl);
      }
    }
  </style>
</head>
<body class="error-page">
  <main class="error-notice">
    <p class="error-code" aria-hidden="true">404</p>
    <h1>That page is not part of the library</h1>
    <p class="error-note">
      The address you followed does not match a volume, a chapter, or a scene.
      Head back to the front page and pick a volume to read.
    </p>
    <a class="button" href="/">Back to the volumes</a>
  </main>
</body>
</html>
